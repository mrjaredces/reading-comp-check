<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Comprehension Check Generator</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white; color: black; font-size: 12pt; }
      .page-break { page-break-after: always; }
    }
    .line-reader-overlay {
      position: absolute;
      left: 0; right: 0;
      background: rgba(254, 240, 138, 0.35);
      border-top: 2px solid #ca8a04;
      border-bottom: 2px solid #ca8a04;
      pointer-events: none;
      transition: top 0.05s ease-out;
      z-index: 20;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div id="root"></div>

  <script type="babel">
    // SET YOUR GOOGLE APPS SCRIPT WEBHOOK URL HERE
    const DEFAULT_WEBHOOK_URL = "PASTE_YOUR_APPS_SCRIPT_WEBHOOK_URL_HERE";

    const DEMO_PASSAGE = {
      title: "The Mystery of Migration",
      lexile: "800L-900L",
      text: "Every autumn, millions of monarch butterflies embark on an extraordinary journey across North America. Spanning thousands of miles, this migration takes them from Canada and the northern United States down to the warm pine forests of central Mexico. What makes this journey truly remarkable is that no single butterfly completes the entire round trip. Instead, it takes four successive generations to fulfill the annual cycle. The butterflies rely on environmental cues such as declining daylight hours and cooling temperatures to signal when it is time to head south. Along their flight path, they depend heavily on flowering plants for nectar to sustain their energy.",
      questions: [
        {
          id: 1,
          question: "Where do monarch butterflies travel during their autumn migration?",
          options: ["From Mexico to Canada", "From Canada/US to central Mexico", "Across the Atlantic Ocean", "To South America"],
          correctIndex: 1,
          explanation: "The passage states that they travel from Canada and the northern US down to central Mexico."
        },
        {
          id: 2,
          question: "Why is the migration described as 'remarkable' in the passage?",
          options: ["They fly faster than birds", "No single butterfly completes the entire round trip", "They do not need food during the trip", "They travel only at night"],
          correctIndex: 1,
          explanation: "The text explains that four successive generations complete the cycle."
        }
      ]
    };

    function App() {
      const [view, setView] = React.useState('teacher');
      const [webhookUrl, setWebhookUrl] = React.useState(() => localStorage.getItem('app_script_url') || DEFAULT_WEBHOOK_URL);
      const [showSettings, setShowSettings] = React.useState(false);
      const [loading, setLoading] = React.useState(false);
      const [errorMsg, setErrorMsg] = React.useState('');
      
      // Generator parameters
      const [lexile, setLexile] = React.useState('800L-900L');
      const [genre, setGenre] = React.useState('Informational');
      const [topic, setTopic] = React.useState('Animal Adaptation');
      const [questionCount, setQuestionCount] = React.useState(4);
      const [dokLevel, setDokLevel] = React.useState('Balanced');
      
      // Current Passage Data
      const [passage, setPassage] = React.useState(DEMO_PASSAGE);
      
      // Student Mode State
      const [studentAnswers, setStudentAnswers] = React.useState({});
      const [studentName, setStudentName] = React.useState('');
      const [submitted, setSubmitted] = React.useState(false);
      const [fontSize, setFontSize] = React.useState('text-base');
      const [theme, setTheme] = React.useState('light');
      
      // Line Reader
      const [lineReaderActive, setLineReaderActive] = React.useState(false);
      const [linePos, setLinePos] = React.useState(0);
      const passageRef = React.useRef(null);

      React.useEffect(() => {
        localStorage.setItem('app_script_url', webhookUrl);
      }, [webhookUrl]);

      const handleMouseMove = (e) => {
        if (!lineReaderActive || !passageRef.current) return;
        const rect = passageRef.current.getBoundingClientRect();
        const relativeY = e.clientY - rect.top;
        if (relativeY >= 0 && relativeY <= rect.height) {
          setLinePos(relativeY - 16);
        }
      };

      const generatePassage = async () => {
        if (!webhookUrl || webhookUrl.includes("PASTE_YOUR")) {
          setErrorMsg("Please enter your Google Apps Script Webhook URL in Teacher Settings!");
          setShowSettings(true);
          return;
        }

        setLoading(true);
        setErrorMsg('');

        const promptText = `Generate a ${genre} reading passage at a ${lexile} Lexile level about '${topic}'. Length: ~225 words. Do NOT include any vocabulary glossary or definition list. Provide ${questionCount} multiple-choice comprehension questions with 4 options each (labeled index 0-3), depth of knowledge focus: ${dokLevel}.
Return ONLY valid JSON matching this structure:
{
  "title": "Title",
  "lexile": "${lexile}",
  "text": "Full passage text here...",
  "questions": [
    {
      "id": 1,
      "question": "Question text",
      "options": ["Option A", "Option B", "Option C", "Option D"],
      "correctIndex": 0,
      "explanation": "Brief explanation"
    }
  ]
}`;

        try {
          const res = await fetch(webhookUrl, {
            method: 'POST',
            body: JSON.stringify({
              action: 'generate',
              prompt: promptText
            })
          });

          const data = await res.json();
          let jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (jsonText) {
            jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(jsonText);
            setPassage(parsed);
            setStudentAnswers({});
            setSubmitted(false);
          } else {
            throw new Error("Invalid response format from script proxy.");
          }
        } catch (err) {
          console.error(err);
          setErrorMsg("Generation error. Loaded fallback demo passage.");
          setPassage(DEMO_PASSAGE);
        } finally {
          setLoading(false);
        }
      };

      const handleStudentSubmit = async () => {
        if (!studentName.trim()) {
          alert("Please enter your name before submitting.");
          return;
        }

        let correct = 0;
        passage.questions.forEach(q => {
          if (studentAnswers[q.id] === q.correctIndex) correct++;
        });

        const scoreStr = `${correct} / ${passage.questions.length} (${Math.round((correct / passage.questions.length) * 100)}%)`;

        const payload = {
          action: 'submitResults',
          timestamp: new Date().toLocaleString(),
          studentName: studentName,
          passageTitle: passage.title,
          lexile: passage.lexile,
          score: scoreStr,
          responses: studentAnswers
        };

        setSubmitted(true);

        if (webhookUrl && !webhookUrl.includes("PASTE_YOUR")) {
          try {
            await fetch(webhookUrl, {
              method: 'POST',
              body: JSON.stringify(payload)
            });
          } catch (err) {
            console.error("Failed to post submission:", err);
          }
        }
      };

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-6">
          {/* Top Bar */}
          <header className="no-print bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-wrap justify-between items-center gap-4">
            <div>
              <h1 className="text-xl font-bold text-slate-900">Reading Assessment Check Generator</h1>
              <p className="text-xs text-slate-500">School-Wide Secure Deployment</p>
            </div>
            <div className="flex items-center gap-2">
              <button 
                onClick={() => setView('teacher')} 
                className={`px-4 py-2 rounded-lg font-medium text-sm transition ${view === 'teacher' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                Teacher View
              </button>
              <button 
                onClick={() => setView('student')} 
                className={`px-4 py-2 rounded-lg font-medium text-sm transition ${view === 'student' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                Student View
              </button>
              <button 
                onClick={() => window.print()} 
                className="px-3 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium hover:bg-slate-900">
                Print
              </button>
              <button 
                onClick={() => setShowSettings(!showSettings)} 
                className="p-2 text-slate-500 hover:text-slate-700 rounded-lg hover:bg-slate-100">
                ⚙️
              </button>
            </div>
          </header>

          {/* Settings Modal */}
          {showSettings && (
            <div className="no-print bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 text-sm text-amber-900">
              <h3 className="font-bold mb-2">Google Apps Script Webhook Integration</h3>
              <p className="mb-2 text-xs">Enter your Google Apps Script URL below to power passage generation and Google Sheets score export automatically for all staff:</p>
              <input 
                type="text" 
                value={webhookUrl} 
                onChange={(e) => setWebhookUrl(e.target.value)} 
                placeholder="https://script.google.com/macros/s/.../exec"
                className="w-full p-2 border border-amber-300 rounded bg-white text-xs font-mono mb-2"
              />
              <button onClick={() => setShowSettings(false)} className="px-3 py-1 bg-amber-800 text-white rounded text-xs font-bold">
                Save & Close
              </button>
            </div>
          )}

          {errorMsg && (
            <div className="no-print bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg mb-6 text-sm">
              {errorMsg}
            </div>
          )}

          {/* TEACHER VIEW */}
          {view === 'teacher' && (
            <div className="space-y-6">
              <div className="no-print bg-white p-6 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Lexile Band</label>
                  <select value={lexile} onChange={(e) => setLexile(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg text-sm">
                    <option value="400L-500L">400L - 500L (Grades 2-3)</option>
                    <option value="600L-700L">600L - 700L (Grades 3-4)</option>
                    <option value="800L-900L">800L - 900L (Grades 4-5)</option>
                    <option value="1000L-1100L">1000L - 1100L (Grades 6-8)</option>
                    <option value="1100L+">1100L+ (High School)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Genre</label>
                  <select value={genre} onChange={(e) => setGenre(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg text-sm">
                    <option value="Informational">Informational Text</option>
                    <option value="Literary">Literary / Narrative</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Topic</label>
                  <input type="text" value={topic} onChange={(e) => setTopic(e.target.value)} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                </div>
                <div className="md:col-span-3">
                  <button 
                    onClick={generatePassage} 
                    disabled={loading}
                    className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition disabled:opacity-50">
                    {loading ? "Generating Assessment..." : "Generate New Passage & Assessment"}
                  </button>
                </div>
              </div>

              {/* Passage Preview */}
              <div className="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
                <div className="flex justify-between items-center border-b pb-4 mb-4">
                  <h2 className="text-2xl font-bold text-slate-900">{passage.title}</h2>
                  <span className="px-3 py-1 bg-slate-100 text-slate-600 font-semibold rounded-full text-xs">{passage.lexile}</span>
                </div>
                <p className="text-slate-700 leading-relaxed text-base mb-8 whitespace-pre-line">{passage.text}</p>

                <h3 className="font-bold text-lg text-slate-900 mb-4 border-b pb-2">Comprehension Questions</h3>
                <div className="space-y-6">
                  {passage.questions.map((q, idx) => (
                    <div key={q.id} className="p-4 bg-slate-50 rounded-lg border border-slate-200">
                      <p className="font-semibold text-slate-800 mb-2">{idx + 1}. {q.question}</p>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm">
                        {q.options.map((opt, oIdx) => (
                          <div key={oIdx} className={`p-2 rounded border ${oIdx === q.correctIndex ? 'bg-emerald-50 border-emerald-300 font-semibold text-emerald-900' : 'bg-white border-slate-200'}`}>
                            {String.fromCharCode(65 + oIdx)}. {opt}
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* STUDENT VIEW */}
          {view === 'student' && (
            <div className={`p-6 rounded-xl border transition ${theme === 'sepia' ? 'bg-amber-50 border-amber-200 text-amber-900' : theme === 'dark' ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'}`}>
              <div className="no-print flex flex-wrap justify-between items-center gap-4 border-b pb-4 mb-6">
                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => setLineReaderActive(!lineReaderActive)} 
                    className={`px-3 py-1.5 rounded text-xs font-semibold border ${lineReaderActive ? 'bg-amber-400 text-slate-900 border-amber-500' : 'bg-slate-100 text-slate-600'}`}>
                    Line Reader: {lineReaderActive ? 'ON' : 'OFF'}
                  </button>
                  <select value={fontSize} onChange={(e) => setFontSize(e.target.value)} className="p-1.5 border rounded text-xs text-slate-800">
                    <option value="text-sm">Small Text</option>
                    <option value="text-base">Medium Text</option>
                    <option value="text-lg">Large Text</option>
                  </select>
                  <select value={theme} onChange={(e) => setTheme(e.target.value)} className="p-1.5 border rounded text-xs text-slate-800">
                    <option value="light">Light Theme</option>
                    <option value="sepia">Sepia Theme</option>
                    <option value="dark">Dark Theme</option>
                  </select>
                </div>
                <input 
                  type="text" 
                  placeholder="Enter Student Name" 
                  value={studentName} 
                  onChange={(e) => setStudentName(e.target.value)}
                  className="p-2 border rounded text-sm text-slate-800"
                />
              </div>

              {!submitted ? (
                <div>
                  <h2 className="text-2xl font-bold mb-4">{passage.title}</h2>
                  <div 
                    ref={passageRef} 
                    onMouseMove={handleMouseMove}
                    className={`relative leading-relaxed mb-8 ${fontSize} whitespace-pre-line select-none`}>
                    {lineReaderActive && (
                      <div className="line-reader-overlay" style={{ top: `${linePos}px`, height: '28px' }} />
                    )}
                    {passage.text}
                  </div>

                  <h3 className="font-bold text-lg mb-4 border-b pb-2">Questions</h3>
                  <div className="space-y-6 mb-8">
                    {passage.questions.map((q, idx) => (
                      <div key={q.id} className="p-4 rounded-lg border border-slate-200/50 bg-slate-50/5 text-slate-800">
                        <p className="font-semibold mb-3">{idx + 1}. {q.question}</p>
                        <div className="space-y-2">
                          {q.options.map((opt, oIdx) => (
                            <label key={oIdx} className="flex items-center gap-3 p-3 rounded-lg border border-slate-200 hover:bg-slate-100/50 cursor-pointer text-sm">
                              <input 
                                type="radio" 
                                name={`question-${q.id}`} 
                                checked={studentAnswers[q.id] === oIdx} 
                                onChange={() => setStudentAnswers({...studentAnswers, [q.id]: oIdx})}
                              />
                              <span>{String.fromCharCode(65 + oIdx)}. {opt}</span>
                            </label>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>

                  <button 
                    onClick={handleStudentSubmit}
                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow">
                    Submit Assessment
                  </button>
                </div>
              ) : (
                <div className="text-center py-12 space-y-4">
                  <div className="text-5xl">✅</div>
                  <h2 className="text-2xl font-bold">Assessment Submitted Successfully</h2>
                  <p className="text-sm opacity-75">Thank you, {studentName}. Your answers have been logged for your teacher.</p>
                  <button 
                    onClick={() => { setSubmitted(false); setStudentAnswers({}); }} 
                    className="px-4 py-2 bg-slate-800 text-white text-xs font-bold rounded">
                    Take Again / Reset
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
