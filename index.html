<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Comprehension Check Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-lexend {
      font-family: 'Lexend', sans-serif;
    }
    .serif-passage {
      font-family: 'Merriweather', Georgia, serif;
    }

    /* Print Stylesheet Optimization */
    @media print {
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      body {
        background-color: white !important;
        color: black !important;
        font-size: 11pt !important;
      }
      .print-container {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      .page-break {
        page-break-before: always !important;
      }
      .bubble-option {
        border: 1.5px solid #000 !important;
      }
    }
    @media screen {
      .print-only {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // DEFAULT FIXED SCHOOL API KEY
    const DEFAULT_SCHOOL_API_KEY = "AQ.Ab8RN6IHysys92pnElLX1o8zqAEtxC5vRWaPIQg7v_cQfqzbyQ";

    // --- MOCK SAMPLE PASSAGES (STRICTLY NO VOCABULARY GLOSSARY) ---
    const MOCK_PASSAGES = [
      {
        id: 'sample-1',
        title: 'The Hidden Power of Honeybees',
        lexile: '650L (Grades 4-5)',
        textType: 'Informational',
        wordCount: 235,
        summary: 'An exploration of how honeybees communicate through the waggle dance and their vital role in food pollination.',
        passage: `When you see a honeybee buzzing from flower to flower, it might look like a simple insect searching for a sweet snack. However, bees are actually carrying out one of nature’s most critical jobs: pollination. As a bee collects nectar, tiny grains of pollen stick to its furry body. When the bee travels to the next blossom, some of that pollen rubs off, allowing plants to produce seeds, fruits, and vegetables.

Inside the hive, bees live in a highly organized colony. Thousands of worker bees divide up responsibilities like building honeycombs, caring for young larvae, and guarding the entrance. But how do bees communicate where to find rich flower patches far away? They use an extraordinary dance!

When a returning scout bee finds a rich source of nectar, it performs a "waggle dance" on the honeycomb. By moving in a figure-eight pattern and shaking its body, the bee tells others the exact direction and distance of the flowers relative to the sun. The faster the bee waggles, the closer the flowers are. Through this remarkable aerial language, bees ensure their colony thrives while keeping our food supply growing.`,
        questions: [
          {
            id: 1,
            type: 'Literal',
            question: 'What sticks to a bee’s body when it gathers nectar from a blossom?',
            options: ['Seeds', 'Honey', 'Tiny grains of pollen', 'Flower petals'],
            correctAnswer: 2,
            explanation: 'Paragraph 1 explicitly states: "As a bee collects nectar, tiny grains of pollen stick to its furry body."'
          },
          {
            id: 2,
            type: 'Inferential',
            question: 'What would most likely happen to our food supply if bee populations dropped significantly?',
            options: [
              'Plants would produce much less fruit and vegetables.',
              'Flowers would begin to bloom twice as fast.',
              'Insects like ants would take over building beehives.',
              'Farmers would no longer need to plant seeds.'
            ],
            correctAnswer: 0,
            explanation: 'Since pollination is required for plants to produce fruits and vegetables, fewer bees means fewer plants can reproduce and bear food.'
          },
          {
            id: 3,
            type: 'Evaluative',
            question: 'Why did the author include the detail about the "waggle dance"?',
            options: [
              'To prove that bees prefer dancing over flying.',
              'To explain how bees communicate complex information without speaking.',
              'To show that queen bees control all worker movements.',
              'To argue that honeybees are dangerous to humans.'
            ],
            correctAnswer: 1,
            explanation: 'The detail illustrates the remarkable communication mechanism bees use to convey direction and distance to their colony.'
          },
          {
            id: 4,
            type: 'Context Clues',
            question: 'As used in paragraph 3, what does the word "thrives" mean?',
            options: ['Grows healthy and succeeds', 'Struggles to survive', 'Hides from predators', 'Flies away to new homes'],
            correctAnswer: 0,
            explanation: 'In context, "ensure their colony thrives" means keeping the hive strong, healthy, and successful.'
          }
        ]
      },
      {
        id: 'sample-2',
        title: 'The Mystery of Oak Creek Canyon',
        lexile: '920L (Grades 6-8)',
        textType: 'Literary',
        wordCount: 248,
        summary: 'Maya and Julian discover an unexpected artifact hidden inside an old stone cairn while hiking along Oak Creek.',
        passage: `The autumn wind whistled through the golden ponderosa pines as Maya adjusted her backpack strap. Behind her, her younger brother Julian lagged behind, kicking loose pebbles along the narrow red-rock trail of Oak Creek Canyon. 

"Maya, look!" Julian called out, pointing toward a shadow beneath a steep sandstone overhang. Tucked into a natural crevice was a crumbling stack of balanced river stones—a trail cairn, but far older than the modern markers left by casual weekend hikers.

Curiosity overpowering her caution, Maya scrambled up the shale embankment. Between two weathered granite stones rested a rusted metal cylinder, no longer than a pencil, sealed tightly with hardened pine pitch. Maya gently prized it free with her pocket knife. 

"Should we open it?" Julian whispered, his eyes wide with a mixture of apprehension and wonder.

With a firm twist, the seal snapped, releasing the dry smell of aged paper. Inside lay a hand-drawn map rendered in faded indigo ink, depicting the canyon as it appeared decades ago, marked with a red star near an abandoned copper mine shaft. 

Maya looked up toward the towering canyon walls. The sun was dipping below the western rim, casting long, purple shadows across the valley floor. They knew they had to head back to camp before dark, but as Maya folded the map into her pocket, she knew their weekend hike had just transformed into an adventure.`,
        questions: [
          {
            id: 1,
            type: 'Literal',
            question: 'Where did Maya find the rusted metal cylinder?',
            options: [
              'Floating in the waters of Oak Creek',
              'Inside a crevice between stones in a trail cairn',
              'Buried deep under the pine needles near camp',
              'At the bottom of an old copper mine shaft'
            ],
            correctAnswer: 1,
            explanation: 'Paragraph 3 states that Maya found the cylinder between two weathered stones in a cairn tucked in a sandstone crevice.'
          },
          {
            id: 2,
            type: 'Inferential',
            question: 'Why did Maya decide not to search for the marked copper mine immediately?',
            options: [
              'She didn’t believe the map was authentic.',
              'Julian was too tired and wanted to quit.',
              'The sun was setting and night was approaching.',
              'It started raining heavily in the canyon.'
            ],
            correctAnswer: 2,
            explanation: 'The text notes that the sun was dipping below the rim and purple shadows were growing, requiring them to return to camp before dark.'
          },
          {
            id: 3,
            type: 'Evaluative',
            question: 'How does the author establish a sense of suspense and discovery in the story?',
            options: [
              'By describing a sudden thunderstorm and wild animals',
              'By contrasting Julian’s hesitation with sensory details of aged paper, sealed metal, and fading light',
              'By having the characters argue about who gets to keep the backpack',
              'By revealing the ending in the very first sentence'
            ],
            correctAnswer: 1,
            explanation: 'The author uses sensory details (dry smell, indigo ink, crumbling stones) and cautious dialogue to create a suspenseful mood of discovery.'
          },
          {
            id: 4,
            type: 'Context Clues',
            question: 'What does the word "prized" mean in paragraph 3: "Maya gently prized it free"?',
            options: ['Rewarded with a trophy', 'Leveraged or pulled with care', 'Priced for selling', 'Destroyed completely'],
            correctAnswer: 1,
            explanation: 'To prize something free means to pry or carefully leverage it out of a tight spot.'
          }
        ]
      }
    ];

    // --- LEXILE RANGE DATA ---
    const LEXILE_BANDS = [
      { id: 'BR100L-200L', label: 'BR100L - 200L', grade: 'Grade 1 (Early Reader)' },
      { id: '200L-500L', label: '200L - 500L', grade: 'Grades 2 - 3 (Primary)' },
      { id: '500L-800L', label: '500L - 800L', grade: 'Grades 4 - 5 (Upper Elementary)' },
      { id: '800L-1000L', label: '800L - 1000L', grade: 'Grades 6 - 8 (Middle School)' },
      { id: '1000L-1200L', label: '1000L - 1200L', grade: 'Grades 9 - 10 (High School)' },
      { id: '1200L+', label: '1200L+', grade: 'Grades 11 - 12+ (Advanced / College Prep)' }
    ];

    // --- MAIN REACT APPLICATION ---
    function App() {
      // Config State
      const [lexile, setLexile] = useState('500L-800L');
      const [customLexile, setCustomLexile] = useState('650L');
      const [useCustomLexile, setUseCustomLexile] = useState(false);
      const [textType, setTextType] = useState('Informational');
      const [topic, setTopic] = useState('');
      const [numQuestions, setNumQuestions] = useState(4);
      const [targetWords, setTargetWords] = useState(230);
      const [dokTypes, setDokTypes] = useState(['Literal', 'Inferential', 'Evaluative', 'Context Clues']);

      // Hardcoded Default School API Key & Local Storage Webhook
      const [apiKey, setApiKey] = useState(() => {
        return localStorage.getItem('gemini_api_key') || DEFAULT_SCHOOL_API_KEY;
      });
      const [webhookUrl, setWebhookUrl] = useState(() => {
        return localStorage.getItem('readcheck_webhook') || '';
      });

      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      const [showAppsScriptGuide, setShowAppsScriptGuide] = useState(false);

      // Active Views & Current Passage
      const [activeTab, setActiveTab] = useState('config'); // 'config' | 'print' | 'student' | 'library'
      const [passageData, setPassageData] = useState(MOCK_PASSAGES[0]);
      const [loading, setLoading] = useState(false);
      const [loadingMessage, setLoadingMessage] = useState('');
      const [toast, setToast] = useState(null);

      // Student Assessment State (Strict Independent Compliance)
      const [studentName, setStudentName] = useState('');
      const [studentAnswers, setStudentAnswers] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [submittedResult, setSubmittedResult] = useState(null);

      // Reader Accessibility Controls
      const [lineReaderActive, setLineReaderActive] = useState(false);
      const [lineReaderY, setLineReaderY] = useState(120);
      const [studentTheme, setStudentTheme] = useState('light'); // 'light' | 'sepia' | 'dark'
      const [studentFontSize, setStudentFontSize] = useState('medium'); // 'small' | 'medium' | 'large'
      const passageBoxRef = useRef(null);

      // Printable Worksheet Controls
      const [printShowKey, setPrintShowKey] = useState(false);
      const [printFontSize, setPrintFontSize] = useState('medium');

      // LocalStorage Persistence
      const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem('readcheck_history');
        return saved ? JSON.parse(saved) : MOCK_PASSAGES;
      });
      const [submissions, setSubmissions] = useState(() => {
        const saved = localStorage.getItem('readcheck_submissions');
        return saved ? JSON.parse(saved) : [];
      });

      // Save settings to LocalStorage
      useEffect(() => {
        localStorage.setItem('gemini_api_key', apiKey);
      }, [apiKey]);

      useEffect(() => {
        localStorage.setItem('readcheck_webhook', webhookUrl);
      }, [webhookUrl]);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const saveToHistory = (newPassage) => {
        setHistory(prev => {
          const updated = [newPassage, ...prev.filter(p => p.id !== newPassage.id)];
          localStorage.setItem('readcheck_history', JSON.stringify(updated));
          return updated;
        });
      };

      // Mouse Move Handler for Cursor Line Reader
      const handlePassageMouseMove = (e) => {
        if (!lineReaderActive || !passageBoxRef.current) return;
        const rect = passageBoxRef.current.getBoundingClientRect();
        const yPos = e.clientY - rect.top;
        setLineReaderY(Math.max(20, Math.min(yPos, rect.height - 20)));
      };

      // Export Student Results to Google Sheets CSV
      const exportSubmissionsToCSV = (subsToExport = submissions) => {
        if (!subsToExport || subsToExport.length === 0) {
          showToast('No student submissions found to export.', 'error');
          return;
        }

        const maxQs = Math.max(...subsToExport.map(s => (s.questions ? s.questions.length : 4)));
        let qHeaders = [];
        for (let i = 1; i <= maxQs; i++) {
          qHeaders.push(`Q${i}_Selected`, `Q${i}_CorrectAnswer`, `Q${i}_Result`);
        }

        const headers = [
          'Student Name',
          'Date & Time',
          'Passage Title',
          'Lexile Level',
          'Text Type',
          'Score',
          'Max Score',
          'Percentage',
          ...qHeaders
        ];

        const rows = subsToExport.map(s => {
          const qDetails = (s.questions || []).flatMap((q) => {
            const studentAnsIdx = s.answers[q.id];
            const studentAnsLetter = studentAnsIdx !== undefined ? String.fromCharCode(65 + studentAnsIdx) : 'N/A';
            const correctAnsLetter = String.fromCharCode(65 + q.correctAnswer);
            const isRight = studentAnsIdx === q.correctAnswer ? 'CORRECT' : 'INCORRECT';
            return [studentAnsLetter, correctAnsLetter, isRight];
          });

          return [
            `"${(s.studentName || 'Anonymous').replace(/"/g, '""')}"`,
            `"${s.timestamp}"`,
            `"${s.passageTitle.replace(/"/g, '""')}"`,
            `"${s.lexile}"`,
            `"${s.textType}"`,
            s.score,
            s.maxScore,
            `"${Math.round((s.score / s.maxScore) * 100)}%"`,
            ...qDetails
          ].join(',');
        });

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `readcheck_student_results_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Downloaded Google Sheets CSV Export!');
      };

      // Background POST Webhook Delivery
      const sendWebhookPayload = async (submissionPayload) => {
        if (!webhookUrl.trim()) return;
        try {
          await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(submissionPayload),
            mode: 'no-cors'
          });
          console.log('Webhook payload dispatched to Google Sheets');
        } catch (err) {
          console.warn('Webhook delivery error:', err);
        }
      };

      // Student Assessment Submission
      const handleStudentSubmit = () => {
        if (!studentName.trim()) {
          showToast('Please enter the Student Name before submitting.', 'error');
          return;
        }
        if (Object.keys(studentAnswers).length < passageData.questions.length) {
          showToast('Please answer all questions before submitting.', 'error');
          return;
        }

        // Quiet Score Evaluation behind the scenes
        let score = 0;
        passageData.questions.forEach(q => {
          if (studentAnswers[q.id] === q.correctAnswer) {
            score++;
          }
        });

        const submission = {
          id: 'sub-' + Date.now(),
          studentName: studentName.trim(),
          timestamp: new Date().toLocaleString(),
          passageTitle: passageData.title,
          lexile: passageData.lexile,
          textType: passageData.textType,
          score: score,
          maxScore: passageData.questions.length,
          answers: studentAnswers,
          questions: passageData.questions
        };

        const updatedSubmissions = [submission, ...submissions];
        setSubmissions(updatedSubmissions);
        localStorage.setItem('readcheck_submissions', JSON.stringify(updatedSubmissions));

        if (webhookUrl) {
          sendWebhookPayload(submission);
        }

        setSubmittedResult(submission);
        setIsSubmitted(true);
        showToast('Assessment submitted quietly.');
      };

      const toggleDok = (type) => {
        if (dokTypes.includes(type)) {
          if (dokTypes.length > 1) {
            setDokTypes(dokTypes.filter(t => t !== type));
          }
        } else {
          setDokTypes([...dokTypes, type]);
        }
      };

      // GEMINI API GENERATION METHOD (STRICT NO-GLOSSARY SCHEMA)
      const handleGenerate = async () => {
        const selectedLexileStr = useCustomLexile ? customLexile : lexile;
        
        setLoading(true);
        setLoadingMessage('Designing aligned passage and crafting comprehension questions with Gemini AI...');

        try {
          const currentApiKey = apiKey || DEFAULT_SCHOOL_API_KEY;
          
          const prompt = `Generate a reading comprehension check passage and question set based on the following specifications:
- Lexile Reading Level Range: ${selectedLexileStr}
- Text Genre/Type: ${textType}
- Subject/Topic: ${topic ? topic : 'Engaging age-appropriate topic suitable for the reading level'}
- Target Passage Length: Approximately ${targetWords} words (between 180 and 260 words).
- Number of Multiple Choice Questions: ${numQuestions}
- Question Depth of Knowledge / Types to Include: ${dokTypes.join(', ')}

IMPORTANT: DO NOT include any vocabulary definitions list, glossary, or vocabulary key. Only output the passage title, text, summary, and multiple-choice questions.

Ensure the text uses vocabulary and sentence structure strictly aligned to the ${selectedLexileStr} level. 
Each multiple-choice question must have exactly 4 options (A, B, C, D), 1 correct answer index (0 for A, 1 for B, 2 for C, 3 for D), and a clear pedagogical explanation for the teacher answer key.`;

          const jsonSchema = {
            type: "OBJECT",
            properties: {
              title: { type: "STRING" },
              lexile: { type: "STRING" },
              textType: { type: "STRING" },
              wordCount: { type: "INTEGER" },
              summary: { type: "STRING" },
              passage: { type: "STRING" },
              questions: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    id: { type: "INTEGER" },
                    type: { type: "STRING" },
                    question: { type: "STRING" },
                    options: {
                      type: "ARRAY",
                      items: { type: "STRING" }
                    },
                    correctAnswer: { type: "INTEGER" },
                    explanation: { type: "STRING" }
                  },
                  required: ["id", "type", "question", "options", "correctAnswer", "explanation"]
                }
              }
            },
            required: ["title", "lexile", "textType", "wordCount", "summary", "passage", "questions"]
          };

          const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: {
              parts: [{
                text: "You are an expert K-12 reading specialist and educational assessment author. You write compelling passages precisely calibrated to requested Lexile levels, accompanied by rigorous, standards-aligned comprehension questions. Do NOT generate any vocabulary glossaries or word definition lists."
              }]
            },
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: jsonSchema,
              temperature: 0.7
            }
          };

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${currentApiKey}`;

          let response;
          let delay = 1000;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (response.ok) break;
            } catch (err) {
              if (attempt === 2) throw err;
            }
            await new Promise(res => setTimeout(res, delay));
            delay *= 2;
          }

          if (!response || !response.ok) {
            const errorMsg = response ? await response.text() : 'Network connection failed';
            throw new Error(`API Error: ${errorMsg}`);
          }

          const result = await response.json();
          const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!jsonText) throw new Error("Did not receive a valid text response from Gemini API.");

          const parsedData = JSON.parse(jsonText);
          parsedData.id = 'gen-' + Date.now();
          if (!parsedData.lexile) parsedData.lexile = selectedLexileStr;

          // Strip any accidental vocabulary field if returned
          delete parsedData.vocabulary;

          setPassageData(parsedData);
          saveToHistory(parsedData);
          setStudentAnswers({});
          setIsSubmitted(false);
          showToast('Passage and assessment generated successfully!', 'success');
          setActiveTab('print');
        } catch (err) {
          console.error(err);
          showToast(`Generation failed. ${err.message || 'Check your API Key.'}`, 'error');
        } finally {
          setLoading(false);
        }
      };

      const loadSample = (sample) => {
        const cleanSample = { ...sample };
        delete cleanSample.vocabulary;
        setPassageData(cleanSample);
        setStudentAnswers({});
        setIsSubmitted(false);
        showToast(`Loaded preset: "${cleanSample.title}"`);
        setActiveTab('print');
      };

      // Theme Classes for Student View
      const getStudentThemeClasses = () => {
        switch (studentTheme) {
          case 'sepia':
            return {
              bg: 'bg-[#fbf0d9]',
              card: 'bg-[#f4e7ce] border-[#e2d5b9]',
              text: 'text-[#433422]',
              subtext: 'text-[#7a6549]',
              accent: 'border-[#c9b793]'
            };
          case 'dark':
            return {
              bg: 'bg-slate-950',
              card: 'bg-slate-900 border-slate-800',
              text: 'text-slate-100',
              subtext: 'text-slate-400',
              accent: 'border-slate-700'
            };
          default:
            return {
              bg: 'bg-slate-50',
              card: 'bg-white border-slate-200',
              text: 'text-slate-900',
              subtext: 'text-slate-500',
              accent: 'border-slate-200'
            };
        }
      };

      const themeCls = getStudentThemeClasses();

      const getStudentFontCls = () => {
        switch (studentFontSize) {
          case 'small': return 'text-sm sm:text-base leading-relaxed';
          case 'large': return 'text-lg sm:text-xl leading-loose';
          default: return 'text-base sm:text-lg leading-relaxed';
        }
      };

      return (
        <div className={`min-h-screen flex flex-col ${activeTab === 'student' ? themeCls.bg : 'bg-slate-50'} text-slate-900`}>
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl text-white flex items-center gap-3 transition-all ${
              toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'
            }`}>
              <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
              <span className="font-medium text-sm">{toast.msg}</span>
            </div>
          )}

          {/* HEADER NAV BAR */}
          <header className="bg-slate-900 text-white shadow-md no-print sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('config')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-blue-400 flex items-center justify-center font-bold text-lg shadow-lg">
                  📖
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight flex items-center gap-2 font-lexend">
                    ReadCheck AI
                    <span className="text-[10px] bg-indigo-500/30 text-indigo-300 font-mono px-2 py-0.5 rounded-full border border-indigo-400/30">
                      Independent Evaluation
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">Reading Comprehension Check Generator</p>
                </div>
              </div>

              {/* NAV TABS */}
              <nav className="flex items-center space-x-1 sm:space-x-2 bg-slate-800/80 p-1 rounded-xl border border-slate-700/60">
                <button
                  onClick={() => setActiveTab('config')}
                  className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all flex items-center gap-1.5 ${
                    activeTab === 'config' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  <span>⚙️</span> Generator
                </button>
                <button
