<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Comprehension Assessment Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & ReactDOM 18 UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX Compilation (Must be type="text/babel") -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-lexend {
      font-family: 'Lexend', sans-serif;
    }
    .serif-passage {
      font-family: 'Merriweather', Georgia, serif;
    }

    /* Print Stylesheet Optimization */
    @media print {
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      body {
        background-color: white !important;
        color: black !important;
        font-size: 11pt !important;
      }
      .print-container {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      .page-break {
        page-break-before: always !important;
      }
      .bubble-option {
        border: 1.5px solid #000 !important;
      }
    }
    @media screen {
      .print-only {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <!-- Note: type="text/babel" is MANDATORY for Babel standalone compilation -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // PRE-LOADED DEMO PASSAGES (STRICTLY NO VOCABULARY GLOSSARY)
    const DEMO_PASSAGES = [
      {
        id: 'demo-1',
        title: 'The Mystery of Bird Migration',
        lexile: '800L-900L (Grades 4-5)',
        textType: 'Informational',
        wordCount: 228,
        summary: 'An exploration of how migratory birds navigate thousands of miles across Earth using environmental cues.',
        passage: `Every autumn, millions of migratory birds embark on an extraordinary journey across continents. Spanning thousands of miles, this seasonal movement takes them from northern breeding grounds to warmer southern wintering habitats. What makes this journey truly remarkable is their precise navigation ability. Birds utilize a combination of environmental cues to stay on course, including the position of the sun during the day, star patterns at night, and Earth's invisible magnetic field.

Scientists have discovered that special proteins in the eyes of migratory birds allow them to perceive magnetic force lines like an internal compass. Along their flight paths, these travelers stop at specific wetland habitats to feed and restore vital energy reserves. Maintaining these stopover sites is critical for bird conservation, as habitat loss along migration corridors can severely diminish bird populations worldwide.

Through instincts passed down across generations, young birds navigate these treacherous global routes for the very first time without adult guidance, ensuring the long-term survival of their species.`,
        questions: [
          {
            id: 1,
            type: 'Literal',
            question: 'What do birds use to navigate during their migration?',
            options: [
              'Weather maps and wind directions',
              'The sun, star patterns, and magnetic fields',
              'Landmarks like highways and rivers',
              'Audio signals from other animal species'
            ],
            correctAnswer: 1,
            explanation: 'The passage explicitly lists the sun, star patterns at night, and Earth’s magnetic field as navigation tools.'
          },
          {
            id: 2,
            type: 'Inferential',
            question: 'What would most likely happen if stopover wetland habitats were destroyed?',
            options: [
              'Birds would stop migrating altogether.',
              'Birds would struggle to survive because they could not refuel energy.',
              'Birds would build nests earlier in the spring.',
              'Birds would migrate exclusively during daylight hours.'
            ],
            correctAnswer: 1,
            explanation: 'The text notes that stopover sites are necessary for birds to feed and restore energy needed to finish their flight.'
          },
          {
            id: 3,
            type: 'Evaluative',
            question: 'Why did the author include information about young birds flying without adults?',
            options: [
              'To prove that adult birds are poor parents.',
              'To emphasize how powerful natural migratory instincts are.',
              'To argue that young birds fly faster than adult birds.',
              'To show that bird migrations happen by accident.'
            ],
            correctAnswer: 1,
            explanation: 'Highlighting that young birds navigate complex routes alone demonstrates that migratory ability is an inherited instinct.'
          },
          {
            id: 4,
            type: 'Context Clues',
            question: 'What does the word "diminish" mean in paragraph 2: "severely diminish bird populations"?',
            options: ['Increase', 'Reduce or shrink', 'Protect', 'Observe'],
            correctAnswer: 1,
            explanation: 'In context, losing stopover habitats reduces or shrinks the total number of surviving birds.'
          }
        ]
      },
      {
        id: 'demo-2',
        title: 'Echoes of the Red Rock Canyon',
        lexile: '600L-700L (Grades 3-4)',
        textType: 'Literary',
        wordCount: 215,
        summary: 'Leo and Sam uncover an old trail marker hidden along a canyon wall while exploring.',
        passage: `The dry afternoon breeze rustled through the juniper trees as Leo adjusted his water canteen. Behind him, his cousin Sam pointed toward a deep shadow stretching across the canyon wall.

"Look up there, Leo!" Sam exclaimed. "There’s a small ledge carved into the rock."

Curious, Leo scrambled up the dusty embankment. Tucked inside a shallow niche was a stack of smooth river stones—a trail cairn left long ago. Between two granite stones rested a small brass cylinder sealed with beeswax.

"Is it a secret message?" Sam whispered, scrambling up beside him.

Leo carefully twisted the brass cap. Inside was a rolled slip of thick parchment. Unfolding it gently, they saw a hand-drawn map of the canyon with a small compass star in the corner. A faint pencil line led toward a hidden spring near Pine Creek.

The sun was dropping behind the western ridges, signaling that night was near. Leo carefully slid the map back inside his pocket. They needed to return to their family's campsite before dark, but both boys knew their quiet weekend hike had just turned into an exciting mystery.`,
        questions: [
          {
            id: 1,
            type: 'Literal',
            question: 'What did Leo find inside the brass cylinder?',
            options: [
              'A small iron key',
              'A hand-drawn map on thick parchment',
              'A shiny silver coin',
              'A collection of dried leaves'
            ],
            correctAnswer: 1,
            explanation: 'Paragraph 5 states that inside the cylinder was a rolled slip of parchment containing a hand-drawn map.'
          },
          {
            id: 2,
            type: 'Inferential',
            question: 'Why did the boys decide to head back to camp instead of following the map immediately?',
            options: [
              'They lost interest in the map.',
              'The sun was setting and daylight was fading.',
              'It started raining heavily in the canyon.',
              'They were out of drinking water.'
            ],
            correctAnswer: 1,
            explanation: 'The passage mentions the sun dropping behind the ridges and the need to return before dark.'
          },
          {
            id: 3,
            type: 'Context Clues',
            question: 'What does the word "niche" mean as used in paragraph 3?',
            options: [
              'A deep underground cave',
              'A shallow hollow or recess in a wall',
              'A wooden storage box',
              'A high mountain peak'
            ],
            correctAnswer: 1,
            explanation: 'In context, a niche is a small hollowed space in the rock wall where the cairn was tucked.'
          }
        ]
      }
    ];

    const LEXILE_BANDS = [
      { id: '400L-500L', label: '400L - 500L', grade: 'Grades 2 - 3 (Primary)' },
      { id: '600L-700L', label: '600L - 700L', grade: 'Grades 3 - 4 (Elementary)' },
      { id: '800L-900L', label: '800L - 900L', grade: 'Grades 4 - 5 (Upper Elem)' },
      { id: '1000L-1100L', label: '1000L - 1100L', grade: 'Grades 6 - 8 (Middle School)' },
      { id: '1100L+', label: '1100L+', grade: 'Grades 9 - 12+ (High School)' }
    ];

    function App() {
      // Configuration & Settings State
      const [lexile, setLexile] = useState('800L-900L');
      const [textType, setTextType] = useState('Informational');
      const [topic, setTopic] = useState('');
      const [numQuestions, setNumQuestions] = useState(4);
      const [dokTypes, setDokTypes] = useState(['Literal', 'Inferential', 'Evaluative', 'Context Clues']);
      
      const [webhookUrl, setWebhookUrl] = useState(() => {
        return localStorage.getItem('readcheck_webhook_url') || '';
      });
      const [showSettingsModal, setShowSettingsModal] = useState(false);

      // App Tab View: 'config' | 'print' | 'student' | 'library'
      const [activeTab, setActiveTab] = useState('config');
      const [passageData, setPassageData] = useState(DEMO_PASSAGES[0]);
      const [loading, setLoading] = useState(false);
      const [loadingMessage, setLoadingMessage] = useState('');
      const [toast, setToast] = useState(null);

      // Student Mode Assessment State
      const [studentName, setStudentName] = useState('');
      const [studentAnswers, setStudentAnswers] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [submittedResult, setSubmittedResult] = useState(null);

      // Student View Reader Controls
      const [lineReaderActive, setLineReaderActive] = useState(false);
      const [lineReaderY, setLineReaderY] = useState(120);
      const [studentTheme, setStudentTheme] = useState('light'); // 'light' | 'sepia' | 'dark'
      const [studentFontSize, setStudentFontSize] = useState('medium'); // 'small' | 'medium' | 'large'
      const passageBoxRef = useRef(null);

      // Print Controls
      const [printShowKey, setPrintShowKey] = useState(false);

      // Persistent Storage
      const [submissions, setSubmissions] = useState(() => {
        const saved = localStorage.getItem('readcheck_submissions_log');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => {
        localStorage.setItem('readcheck_webhook_url', webhookUrl);
      }, [webhookUrl]);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3800);
      };

      // Mouse position tracker for visual line reader bar
      const handlePassageMouseMove = (e) => {
        if (!lineReaderActive || !passageBoxRef.current) return;
        const rect = passageBoxRef.current.getBoundingClientRect();
        const yPos = e.clientY - rect.top;
        setLineReaderY(Math.max(20, Math.min(yPos, rect.height - 20)));
      };

      // CSV Data Exporter for Google Sheets
      const exportSubmissionsToCSV = (subsToExport = submissions) => {
        if (!subsToExport || subsToExport.length === 0) {
          showToast('No student submissions found to export.', 'error');
          return;
        }

        const maxQs = Math.max(...subsToExport.map(s => (s.questions ? s.questions.length : 4)));
        let qHeaders = [];
        for (let i = 1; i <= maxQs; i++) {
          qHeaders.push(`Q${i}_Selected`, `Q${i}_CorrectAnswer`, `Q${i}_Result`);
        }

        const headers = [
          'Student Name',
          'Date & Time',
          'Passage Title',
          'Lexile Level',
          'Score',
          'Max Score',
          'Percentage',
          ...qHeaders
        ];

        const rows = subsToExport.map(s => {
          const qDetails = (s.questions || []).flatMap((q) => {
            const studentAnsIdx = s.answers[q.id];
            const studentAnsLetter = studentAnsIdx !== undefined ? String.fromCharCode(65 + studentAnsIdx) : 'N/A';
            const correctAnsLetter = String.fromCharCode(65 + q.correctAnswer);
            const isRight = studentAnsIdx === q.correctAnswer ? 'CORRECT' : 'INCORRECT';
            return [studentAnsLetter, correctAnsLetter, isRight];
          });

          return [
            `"${(s.studentName || 'Anonymous').replace(/"/g, '""')}"`,
            `"${s.timestamp}"`,
            `"${s.passageTitle.replace(/"/g, '""')}"`,
            `"${s.lexile}"`,
            s.score,
            s.maxScore,
            `"${Math.round((s.score / s.maxScore) * 100)}%"`,
            ...qDetails
          ].join(',');
        });

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `reading_assessment_results_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Downloaded Google Sheets CSV export!');
      };

      // CORS-Safe Post Payload to Google Apps Script Proxy
      const sendToAppsScriptProxy = async (payloadData) => {
        if (!webhookUrl.trim()) return null;
        try {
          // Using text/plain prevents CORS preflight OPTIONS requests from being blocked by Google
          const res = await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payloadData)
          });
          if (res.ok) {
            const text = await res.text();
            try {
              return JSON.parse(text);
            } catch (e) {
              return text;
            }
          }
        } catch (err) {
          console.warn('Apps Script Webhook request error:', err);
        }
        return null;
      };

      // Generator Action
      const handleGeneratePassage = async () => {
        setLoading(true);
        setLoadingMessage('Communicating with Proxy Webhook to generate passage...');

        const promptText = `Generate a ${textType} reading passage calibrated strictly to ${lexile} Lexile level about '${topic || 'an age-appropriate topic'}'. 
Passage target word count: ~225 words. 
Generate ${numQuestions} multiple choice questions focusing on Depth of Knowledge: ${dokTypes.join(', ')}.

CRITICAL REQUIREMENT: Strictly DO NOT include any vocabulary glossary, word list, or definition key anywhere in the output.

Return ONLY valid JSON matching this structure:
{
  "title": "Passage Title",
  "lexile": "${lexile}",
  "textType": "${textType}",
  "wordCount": 225,
  "summary": "Brief summary",
  "passage": "Full passage text here...",
  "questions": [
    {
      "id": 1,
      "type": "Literal",
      "question": "Question text?",
      "options": ["Option A", "Option B", "Option C", "Option D"],
      "correctAnswer": 0,
      "explanation": "Teacher explanation"
    }
  ]
}`;

        let generatedData = null;

        if (webhookUrl.trim()) {
          const response = await sendToAppsScriptProxy({
            action: 'generate',
            prompt: promptText
          });

          if (response) {
            try {
              let jsonString = typeof response === 'string' ? response : (response.candidates?.[0]?.content?.parts?.[0]?.text || JSON.stringify(response));
              jsonString = jsonString.replace(/```json/g, '').replace(/```/g, '').trim();
              generatedData = JSON.parse(jsonString);
            } catch (err) {
              console.error('JSON parsing failed from webhook response:', err);
            }
          }
        }

        // Fallback to demo passages if Webhook is not configured or fails
        if (!generatedData) {
          showToast('Webhook unavailable or not set. Loaded fallback passage.', 'error');
          generatedData = DEMO_PASSAGES[Math.floor(Math.random() * DEMO_PASSAGES.length)];
        } else {
          showToast('Passage generated successfully via Proxy Webhook!');
        }

        delete generatedData.vocabulary;
        setPassageData(generatedData);
        setStudentAnswers({});
        setIsSubmitted(false);
        setLoading(false);
        setActiveTab('print');
      };

      // Student Submission Action
      const handleStudentSubmit = () => {
        if (!studentName.trim()) {
          showToast('Please enter your full name before submitting.', 'error');
          return;
        }
        if (Object.keys(studentAnswers).length < passageData.questions.length) {
          showToast('Please answer all questions before submitting.', 'error');
          return;
        }

        let score = 0;
        passageData.questions.forEach(q => {
          if (studentAnswers[q.id] === q.correctAnswer) {
            score++;
          }
        });

        const record = {
          id: 'sub-' + Date.now(),
          studentName: studentName.trim(),
          timestamp: new Date().toLocaleString(),
          passageTitle: passageData.title,
          lexile: passageData.lexile,
          score: score,
          maxScore: passageData.questions.length,
          answers: studentAnswers,
          questions: passageData.questions
        };

        const updated = [record, ...submissions];
        setSubmissions(updated);
        localStorage.setItem('readcheck_submissions_log', JSON.stringify(updated));

        // Background POST to Apps Script Webhook
        if (webhookUrl.trim()) {
          sendToAppsScriptProxy({
            action: 'submitResults',
            ...record
          });
        }

        setSubmittedResult(record);
        setIsSubmitted(true);
        showToast('Assessment submitted quietly.');
      };

      const toggleDok = (type) => {
        if (dokTypes.includes(type)) {
          if (dokTypes.length > 1) setDokTypes(dokTypes.filter(t => t !== type));
        } else {
          setDokTypes([...dokTypes, type]);
        }
      };

      // Reader Theme Helper
      const getStudentThemeClasses = () => {
        switch (studentTheme) {
          case 'sepia':
            return {
              bg: 'bg-[#fbf0d9]',
              card: 'bg-[#f4e7ce] border-[#e2d5b9]',
              text: 'text-[#433422]',
              subtext: 'text-[#7a6549]',
              accent: 'border-[#c9b793]'
            };
          case 'dark':
            return {
              bg: 'bg-slate-950',
              card: 'bg-slate-900 border-slate-800',
              text: 'text-slate-100',
              subtext: 'text-slate-400',
              accent: 'border-slate-700'
            };
          default:
            return {
              bg: 'bg-slate-50',
              card: 'bg-white border-slate-200',
              text: 'text-slate-900',
              subtext: 'text-slate-500',
              accent: 'border-slate-200'
            };
        }
      };

      const themeCls = getStudentThemeClasses();

      const getStudentFontCls = () => {
        switch (studentFontSize) {
          case 'small': return 'text-sm sm:text-base leading-relaxed';
          case 'large': return 'text-lg sm:text-xl leading-loose';
          default: return 'text-base sm:text-lg leading-relaxed';
        }
      };

      return (
        <div className={`min-h-screen flex flex-col ${activeTab === 'student' ? themeCls.bg : 'bg-slate-50'} text-slate-900`}>
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl text-white flex items-center gap-3 ${
              toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'
            }`}>
              <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
              <span className="font-medium text-sm">{toast.msg}</span>
            </div>
          )}

          {/* HEADER NAV */}
          <header className="bg-slate-900 text-white shadow-md no-print sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('config')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-blue-400 flex items-center justify-center font-bold text-lg shadow">
                  📖
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight flex items-center gap-2 font-lexend">
                    ReadCheck AI
                    <span className="text-[10px] bg-indigo-500/30 text-indigo-300 font-mono px-2 py-0.5 rounded-full border border-indigo-400/30">
                      Independent Evaluation
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">Reading Assessment Generator</p>
                </div>
              </div>

              <nav className="flex items-center space-x-1 bg-slate-800/80 p-1 rounded-xl border border-slate-700">
                <button
                  onClick={() => setActiveTab('config')}
                  className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${
                    activeTab === 'config' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  ⚙️ Generator
                </button>
                <button
                  onClick={() => setActiveTab('print')}
                  className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${
                    activeTab === 'print' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  📄 Printable View
                </button>
                <button
                  onClick={() => setActiveTab('student')}
                  className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${
                    activeTab === 'student' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  💻 Student Mode
                </button>
                <button
                  onClick={() => setActiveTab('library')}
                  className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${
                    activeTab === 'library' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  📊 Results ({submissions.length})
                </button>
              </nav>

              <button
                onClick={() => setShowSettingsModal(true)}
                className="flex items-center gap-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700"
              >
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Teacher Settings</span>
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

            {/* 1. GENERATOR CONFIG VIEW */}
            {activeTab === 'config' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-7 bg-white p-6 sm:p-8 rounded-2xl shadow-lg border border-slate-200 space-y-6">
                  <div>
                    <h2 className="text-xl font-extrabold text-slate-900 font-lexend flex items-center gap-2">
                      <span>🎯</span> Assessment Configuration
                    </h2>
                    <p className="text-xs text-slate-500 mt-1">
                      Set Lexile targets, text genres, topics, and Depth of Knowledge targets.
                    </p>
                  </div>

                  {/* LEXILE SELECTOR */}
                  <div className="space-y-2">
