<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Assessment Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    header {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    h1 { font-size: 1.25rem; font-weight: 700; color: #0f172a; }
    .subtitle { font-size: 0.75rem; color: #64748b; }

    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .btn-primary { background-color: #4f46e5; color: #ffffff; }
    .btn-primary:hover { background-color: #4338ca; }
    .btn-secondary { background-color: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .btn-secondary:hover { background-color: #e2e8f0; }
    .btn-dark { background-color: #1e293b; color: #ffffff; }
    .btn-dark:hover { background-color: #0f172a; }
    .btn-success { background-color: #059669; color: #ffffff; }
    .btn-success:hover { background-color: #047857; }
    .btn-active { background-color: #4f46e5; color: #ffffff; }

    .card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    label { display: block; font-size: 0.75rem; font-weight: 600; color: #475569; margin-bottom: 0.25rem; }
    select, input[type="text"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.875rem;
      background-color: #ffffff;
      color: #0f172a;
    }
    select:focus, input:focus { outline: 2px solid #6366f1; outline-offset: -1px; }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    .alert-error { background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }

    /* Assessment View Styling */
    .passage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }
    .passage-title { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
    .badge {
      background-color: #f1f5f9;
      color: #475569;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .passage-body {
      font-size: 1rem;
      line-height: 1.7;
      color: #334155;
      white-space: pre-line;
      margin-bottom: 2rem;
      position: relative;
    }

    .question-list { display: flex; flex-direction: column; gap: 1.5rem; }
    .question-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .question-text { font-weight: 600; color: #1e293b; margin-bottom: 0.75rem; }
    .option-grid { display: flex; flex-direction: column; gap: 0.5rem; }
    .option-item {
      padding: 0.6rem 0.8rem;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .option-correct {
      background-color: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
      font-weight: 600;
    }

    /* Student Themes */
    .theme-light { background-color: #ffffff; color: #0f172a; }
    .theme-sepia { background-color: #fbf0d9; color: #432818; }
    .theme-dark { background-color: #0f172a; color: #f8fafc; }

    .theme-sepia .card, .theme-sepia header { background-color: #f4e4bc; border-color: #e6ccb2; color: #432818; }
    .theme-sepia .question-card { background-color: #ede0d4; border-color: #ddb892; }
    .theme-sepia .option-item { background-color: #fbf0d9; border-color: #ddb892; color: #432818; }

    .theme-dark .card, .theme-dark header { background-color: #1e293b; border-color: #334155; color: #f8fafc; }
    .theme-dark .question-card { background-color: #0f172a; border-color: #334155; }
    .theme-dark .option-item { background-color: #1e293b; border-color: #475569; color: #f8fafc; }

    .font-sm { font-size: 0.875rem; }
    .font-md { font-size: 1rem; }
    .font-lg { font-size: 1.125rem; }

    /* Line Reader Overlay */
    .line-reader-bar {
      position: absolute;
      left: 0;
      right: 0;
      background-color: rgba(254, 240, 138, 0.4);
      border-top: 2px solid #ca8a04;
      border-bottom: 2px solid #ca8a04;
      pointer-events: none;
      transition: top 0.03s linear;
      z-index: 10;
    }

    /* Print Styles */
    @media print {
      .no-print { display: none !important; }
      body { background-color: #ffffff; color: #000000; font-size: 11pt; }
      .container { max-width: 100%; padding: 0; }
      .card { border: none; padding: 0; box-shadow: none; margin-bottom: 1rem; }
      .passage-title { font-size: 18pt; }
      .passage-body { font-size: 11pt; line-height: 1.6; margin-bottom: 1.5rem; }
      .question-card { background-color: #ffffff; border: none; padding: 0; margin-bottom: 1.25rem; }
      .option-item { border: none; padding: 0.2rem 0; background: none; }
      .print-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; border-bottom: 2px solid #000; padding-bottom: 0.5rem; }
      .page-break { page-break-before: always; }
    }

    @media screen {
      .print-only { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header Navigation -->
    <header class="no-print">
      <div>
        <h1>Reading Comprehension Check</h1>
        <div class="subtitle">Zero-Configuration School Deployment</div>
      </div>
      <div class="btn-group">
        <button id="btnTeacher" class="btn btn-active" onclick="window.switchView('teacher')">Teacher View</button>
        <button id="btnStudent" class="btn btn-secondary" onclick="window.switchView('student')">Student View</button>
        <button class="btn btn-dark" onclick="window.print()">Print Worksheet</button>
      </div>
    </header>

    <!-- Global Diagnostic Alert -->
    <div id="alertBox" class="alert alert-error no-print"></div>

    <!-- TEACHER VIEW -->
    <div id="teacherView">
      <div class="card no-print">
        <div class="form-grid">
          <div>
            <label for="lexileSelect">Lexile Level Band</label>
            <select id="lexileSelect">
              <option value="400L-500L">400L - 500L (Grades 2-3)</option>
              <option value="600L-700L">600L - 700L (Grades 3-4)</option>
              <option value="800L-900L" selected>800L - 900L (Grades 4-5)</option>
              <option value="1000L-1100L">1000L - 1100L (Grades 6-8)</option>
              <option value="1100L+">1100L+ (High School)</option>
            </select>
          </div>
          <div>
            <label for="genreSelect">Text Genre</label>
            <select id="genreSelect">
              <option value="Informational" selected>Informational Text</option>
              <option value="Literary">Literary / Narrative</option>
            </select>
          </div>
          <div>
            <label for="topicInput">Topic / Subject Matter</label>
            <input type="text" id="topicInput" value="Animal Adaptation and Survival" placeholder="e.g. Ecosystems, Space, History">
          </div>
        </div>
        <button id="btnGenerate" class="btn btn-primary" style="width: 100%; padding: 0.75rem;" onclick="window.generateAssessment()">
          Generate New Passage & Assessment
        </button>
      </div>

      <!-- Teacher Passage & Answer Key Preview -->
      <div class="card" id="teacherPassageContainer">
        <div class="print-header print-only">
          <div><strong>Name:</strong> ___________________________</div>
          <div><strong>Date:</strong> _______________</div>
        </div>
        
        <div class="passage-header">
          <h2 class="passage-title" id="tTitle">Loading...</h2>
          <span class="badge no-print" id="tLexile">---</span>
        </div>
        <div class="passage-body" id="tText"></div>

        <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; border-bottom: 1px solid #cbd5e1; padding-bottom: 0.5rem;">
          Comprehension Questions
        </h3>
        <div class="question-list" id="tQuestions"></div>

        <!-- Printable Teacher Answer Key (Print Only) -->
        <div class="print-only page-break" style="margin-top: 2rem;">
          <h2 style="font-size: 16pt; margin-bottom: 1rem; border-bottom: 2px solid #000;">Teacher Answer Key</h2>
          <div id="tAnswerKey"></div>
        </div>
      </div>
    </div>

    <!-- STUDENT VIEW -->
    <div id="studentView" style="display: none;">
      <div id="studentCard" class="card theme-light">
        <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 1rem; margin-bottom: 1.5rem;">
          <div class="btn-group">
            <button id="btnLineReader" class="btn btn-secondary" onclick="window.toggleLineReader()">Line Reader: OFF</button>
            <select id="fontSelect" style="width: auto;" onchange="window.setStudentFontSize(this.value)">
              <option value="font-sm">Small Text</option>
              <option value="font-md" selected>Medium Text</option>
              <option value="font-lg">Large Text</option>
            </select>
            <select id="themeSelect" style="width: auto;" onchange="window.setStudentTheme(this.value)">
              <option value="theme-light" selected>Light Theme</option>
              <option value="theme-sepia">Sepia Theme</option>
              <option value="theme-dark">Dark Theme</option>
            </select>
          </div>
          <div>
            <input type="text" id="studentNameInput" placeholder="Enter Your Full Name" style="width: 220px;">
          </div>
        </div>

        <div id="studentQuizSection">
          <h2 class="passage-title" id="sTitle" style="margin-bottom: 1rem;"></h2>
          <div id="sPassageWrapper" style="position: relative;" onmousemove="window.handleStudentMouseMove(event)">
            <div id="lineReaderOverlay" class="line-reader-bar" style="display: none; top: 0px; height: 32px;"></div>
            <div class="passage-body font-md" id="sText"></div>
          </div>

          <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 0.5rem;">
            Questions
          </h3>
          <div class="question-list" id="sQuestions" style="margin-bottom: 2rem;"></div>

          <button class="btn btn-success" style="width: 100%; padding: 0.85rem; font-size: 1rem;" onclick="window.submitStudentAssessment()">
            Submit Assessment
          </button>
        </div>

        <!-- Student Submission Confirmation -->
        <div id="studentCompletionSection" style="display: none; text-align: center; padding: 3rem 1rem;">
          <div style="font-size: 3rem; margin-bottom: 1rem;">✅</div>
          <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">Assessment Submitted</h2>
          <p id="sSubmitMsg" style="font-size: 0.95rem; color: #64748b; margin-bottom: 1.5rem;">Thank you! Your responses have been recorded.</p>
          <button class="btn btn-secondary" onclick="window.resetStudentAssessment()">Take Assessment Again</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // HARDCODED WEBHOOK URL
    const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzxDDhxEVpIKogPr-UwALw-yMShLQSW6heDU39MjzXlxgpvwViST9OBdlC5v_REQfnI/exec';

    // FALLBACK DEMO PASSAGE
    const DEMO_PASSAGE = {
      title: "The Mystery of Monarch Migration",
      lexile: "800L-900L",
      text: "Every autumn, millions of monarch butterflies embark on an extraordinary journey across North America. Spanning thousands of miles, this migration takes them from Canada and the northern United States down to the warm pine forests of central Mexico.\n\nWhat makes this journey truly remarkable is that no single butterfly completes the entire round trip. Instead, it takes four successive generations to fulfill the annual cycle. The butterflies rely on environmental cues such as declining daylight hours and cooling temperatures to signal when it is time to head south.\n\nAlong their flight path, they depend heavily on flowering plants for nectar to sustain their energy. Protecting milkweed and nectar habitats remains essential for protecting this remarkable species.",
      questions: [
        {
          id: 1,
          question: "Where do monarch butterflies travel during their autumn migration?",
          options: ["From Mexico to Canada", "From Canada and the northern US to central Mexico", "Across the Atlantic Ocean to Europe", "To warm southern coastal beaches"],
          correctIndex: 1,
          explanation: "The passage states that they travel from Canada/northern US down to central Mexico."
        },
        {
          id: 2,
          question: "Why is the migration described as 'remarkable' in the passage?",
          options: ["They fly faster than migratory birds", "No single butterfly completes the entire round trip", "They travel only at night to avoid predators", "They do not need food during the entire journey"],
          correctIndex: 1,
          explanation: "The text explains that four generations complete the annual cycle."
        },
        {
          id: 3,
          question: "What environmental cues tell the butterflies it is time to head south?",
          options: ["Rising ocean tides and strong winds", "Heavy spring rains and thunder", "Declining daylight hours and cooling temperatures", "Changes in milkweed flower color"],
          correctIndex: 2,
          explanation: "The text specifies daylight hours declining and cooling temperatures."
        }
      ]
    };

    // GLOBAL APP STATE
    let currentPassage = DEMO_PASSAGE;
    let currentView = 'teacher';
    let studentAnswers = {};
    let lineReaderActive = false;

    // DATA NORMALIZATION HELPER
    function sanitizePassage(data) {
      if (!data) return DEMO_PASSAGE;
      return {
        title: data.title || "Untitled Assessment",
        lexile: data.lexile || "Custom Band",
        text: typeof data.text === 'string' ? data.text : (Array.isArray(data.text) ? data.text.join('\n\n') : DEMO_PASSAGE.text),
        questions: Array.isArray(data.questions) ? data.questions.map((q, idx) => ({
          id: q.id || (idx + 1),
          question: q.question || `Question ${idx + 1}`,
          options: Array.isArray(q.options) && q.options.length === 4 ? q.options : ["Option A", "Option B", "Option C", "Option D"],
          correctIndex: typeof q.correctIndex === 'number' ? q.correctIndex : 0,
          explanation: q.explanation || ""
        })) : DEMO_PASSAGE.questions
      };
    }

    // UI RENDER FUNCTIONS
    function renderTeacherView() {
      const p = sanitizePassage(currentPassage);
      document.getElementById('tTitle').innerText = p.title;
      document.getElementById('tLexile').innerText = p.lexile;
      document.getElementById('tText').innerText = p.text;

      let qHtml = '';
      let keyHtml = '';

      p.questions.forEach((q, idx) => {
        qHtml += `
          <div class="question-card">
            <p class="question-text">${idx + 1}. ${q.question}</p>
            <div class="option-grid">
              ${q.options.map((opt, oIdx) => `
                <div class="option-item ${oIdx === q.correctIndex ? 'option-correct' : ''}">
                  <span>${String.fromCharCode(65 + oIdx)}. ${opt}</span>
                  ${oIdx === q.correctIndex ? '<span style="margin-left: auto; font-size: 0.75rem;">✓ Correct</span>' : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `;

        keyHtml += `
          <div style="margin-bottom: 0.75rem; font-size: 11pt;">
            <strong>Question ${idx + 1}:</strong> Option ${String.fromCharCode(65 + q.correctIndex)}.
            ${q.explanation ? `<br><em style="color: #475569;">${q.explanation}</em>` : ''}
          </div>
        `;
      });

      document.getElementById('tQuestions').innerHTML = qHtml;
      document.getElementById('tAnswerKey').innerHTML = keyHtml;
    }

    function renderStudentView() {
      const p = sanitizePassage(currentPassage);
      document.getElementById('sTitle').innerText = p.title;
      document.getElementById('sText').innerText = p.text;

      let qHtml = '';
      p.questions.forEach((q, idx) => {
        const selected = studentAnswers[q.id];
        qHtml += `
          <div class="question-card">
            <p class="question-text">${idx + 1}. ${q.question}</p>
            <div class="option-grid">
              ${q.options.map((opt, oIdx) => `
                <label class="option-item" style="cursor: pointer;">
                  <input type="radio" name="sq_${q.id}" value="${oIdx}" ${selected === oIdx ? 'checked' : ''} onchange="window.recordStudentAnswer(${q.id}, ${oIdx})">
                  <span>${String.fromCharCode(65 + oIdx)}. ${opt}</span>
                </label>
              `).join('')}
            </div>
          </div>
        `;
      });

      document.getElementById('sQuestions').innerHTML = qHtml;
    }

    // EXPOSED GLOBAL EVENT HANDLERS
    window.switchView = function(view) {
      currentView = view;
      const tBtn = document.getElementById('btnTeacher');
      const sBtn = document.getElementById('btnStudent');
      const tView = document.getElementById('teacherView');
      const sView = document.getElementById('studentView');

      if (view === 'teacher') {
        tBtn.className = 'btn btn-active';
        sBtn.className = 'btn btn-secondary';
        tView.style.display = 'block';
        sView.style.display = 'none';
        renderTeacherView();
      } else {
        sBtn.className = 'btn btn-active';
        tBtn.className = 'btn btn-secondary';
        sView.style.display = 'block';
        tView.style.display = 'none';
        renderStudentView();
      }
    };

    window.recordStudentAnswer = function(qId, oIdx) {
      studentAnswers[qId] = oIdx;
    };

    window.toggleLineReader = function() {
      lineReaderActive = !lineReaderActive;
      const btn = document.getElementById('btnLineReader');
      const overlay = document.getElementById('lineReaderOverlay');
      if (lineReaderActive) {
        btn.innerText = 'Line Reader: ON';
        btn.className = 'btn btn-primary';
        overlay.style.display = 'block';
      } else {
        btn.innerText = 'Line Reader: OFF';
        btn.className = 'btn btn-secondary';
        overlay.style.display = 'none';
      }
    };

    window.handleStudentMouseMove = function(e) {
      if (!lineReaderActive) return;
      const wrapper = document.getElementById('sPassageWrapper');
      const rect = wrapper.getBoundingClientRect();
      const relativeY = e.clientY - rect.top;
      if (relativeY >= 0 && relativeY <= rect.height) {
        document.getElementById('lineReaderOverlay').style.top = (relativeY - 16) + 'px';
      }
    };

    window.setStudentTheme = function(themeClass) {
      const card = document.getElementById('studentCard');
      card.className = `card ${themeClass}`;
    };

    window.setStudentFontSize = function(fontClass) {
      const sText = document.getElementById('sText');
      sText.className = `passage-body ${fontClass}`;
    };

    window.submitStudentAssessment = function() {
      const name = document.getElementById('studentNameInput').value.trim();
      if (!name) {
        alert("Please enter your name before submitting.");
        return;
      }

      const p = sanitizePassage(currentPassage);
      let correctCount = 0;
      p.questions.forEach(q => {
        if (studentAnswers[q.id] === q.correctIndex) correctCount++;
      });

      const scoreStr = `${correctCount} / ${p.questions.length} (${Math.round((correctCount / p.questions.length) * 100)}%)`;

      if (WEBHOOK_URL && !WEBHOOK_URL.includes('PASTE_YOUR')) {
        fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submitResults',
            timestamp: new Date().toLocaleString(),
            studentName: name,
            passageTitle: p.title,
            lexile: p.lexile,
            score: scoreStr,
            responses: studentAnswers
          })
        }).catch(err => console.error('Submission log error:', err));
      }

      document.getElementById('studentQuizSection').style.display = 'none';
      document.getElementById('studentCompletionSection').style.display = 'block';
      document.getElementById('sSubmitMsg').innerText = `Thank you, ${name}! Your score of ${scoreStr} has been submitted to your teacher.`;
    };

    window.resetStudentAssessment = function() {
      studentAnswers = {};
      document.getElementById('studentQuizSection').style.display = 'block';
      document.getElementById('studentCompletionSection').style.display = 'none';
      renderStudentView();
    };

    window.generateAssessment = function() {
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('btnGenerate');
      alertBox.style.display = 'none';

      const lexile = document.getElementById('lexileSelect').value;
      const genre = document.getElementById('genreSelect').value;
      const topic = document.getElementById('topicInput').value || 'General Science';

      btn.disabled = true;
      btn.innerText = 'Generating Assessment...';

      const promptText = `Generate a ${genre} reading passage at a ${lexile} Lexile level about '${topic}'. Length: ~225 words. Do NOT include any vocabulary glossary or definition list. Provide 4 multiple-choice comprehension questions with 4 options each (labeled index 0-3).
Return ONLY valid JSON matching this exact structure:
{
  "title": "Passage Title",
  "lexile": "${lexile}",
  "text": "Full passage text...",
  "questions": [
    {
      "id": 1,
      "question": "Question text?",
      "options": ["Option A", "Option B", "Option C", "Option D"],
      "correctIndex": 0,
      "explanation": "Explanation for correct answer."
    }
  ]
}`;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'generate', prompt: promptText }),
        signal: controller.signal
      })
      .then(res => res.json())
      .then(data => {
        clearTimeout(timeoutId);
        let rawJson = data.candidates?.[0]?.content?.parts?.[0]?.text || (typeof data === 'object' ? JSON.stringify(data) : data);
        if (typeof rawJson === 'string') {
          rawJson = rawJson.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(rawJson);
          currentPassage = sanitizePassage(parsed);
        } else {
          currentPassage = sanitizePassage(data);
        }
        studentAnswers = {};
        renderTeacherView();
      })
      .catch(err => {
        console.warn('Webhook generation failed or timed out:', err);
        alertBox.innerText = 'Notice: Could not connect to AI Webhook server. Loaded fallback sample passage.';
        alertBox.style.display = 'block';
        currentPassage = DEMO_PASSAGE;
        renderTeacherView();
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = 'Generate New Passage & Assessment';
      });
    };

    // INITIALIZATION ON PAGE LOAD
    window.addEventListener('DOMContentLoaded', () => {
      renderTeacherView();
    });
  </script>
</body>
</html>
