<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Assessment Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    header {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    h1 { font-size: 1.25rem; font-weight: 700; color: #0f172a; }
    .subtitle { font-size: 0.75rem; color: #64748b; }

    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .btn-primary { background-color: #4f46e5; color: #ffffff; }
    .btn-primary:hover { background-color: #4338ca; }
    .btn-secondary { background-color: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .btn-secondary:hover { background-color: #e2e8f0; }
    .btn-dark { background-color: #1e293b; color: #ffffff; }
    .btn-dark:hover { background-color: #0f172a; }
    .btn-success { background-color: #059669; color: #ffffff; }
    .btn-success:hover { background-color: #047857; }
    .btn-active { background-color: #4f46e5; color: #ffffff; }

    /* Button Selector Pills */
    .selector-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pill-grid { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .pill-btn {
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill-btn:hover { background-color: #f1f5f9; border-color: #94a3b8; }
    .pill-btn.active {
      background-color: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
      box-shadow: 0 1px 3px rgba(79, 70, 229, 0.3);
    }

    .card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    input[type="text"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.875rem;
      background-color: #ffffff;
      color: #0f172a;
    }
    input:focus { outline: 2px solid #6366f1; outline-offset: -1px; }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    .alert-error { background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }

    /* Assessment View Styling */
    .passage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }
    .passage-title { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
    .badge {
      background-color: #f1f5f9;
      color: #475569;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .passage-body {
      font-size: 1rem;
      line-height: 1.7;
      color: #334155;
      white-space: pre-line;
      margin-bottom: 2rem;
      position: relative;
    }

    .question-list { display: flex; flex-direction: column; gap: 1.5rem; }
    .question-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .question-text { font-weight: 600; color: #1e293b; margin-bottom: 0.75rem; }
    .option-grid { display: flex; flex-direction: column; gap: 0.5rem; }
    .option-item {
      padding: 0.6rem 0.8rem;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Student Accommodation Themes */
    .theme-light { background-color: #ffffff; color: #0f172a; }
    .theme-sepia { background-color: #fbf0d9; color: #432818; }
    .theme-dark { background-color: #0f172a; color: #f8fafc; }

    .theme-sepia .card, .theme-sepia header { background-color: #f4e4bc; border-color: #e6ccb2; color: #432818; }
    .theme-sepia .question-card { background-color: #ede0d4; border-color: #ddb892; }
    .theme-sepia .option-item { background-color: #fbf0d9; border-color: #ddb892; color: #432818; }

    .theme-dark .card, .theme-dark header { background-color: #1e293b; border-color: #334155; color: #f8fafc; }
    .theme-dark .question-card { background-color: #0f172a; border-color: #334155; }
    .theme-dark .option-item { background-color: #1e293b; border-color: #475569; color: #f8fafc; }

    .font-sm { font-size: 0.875rem; }
    .font-md { font-size: 1rem; }
    .font-lg { font-size: 1.125rem; }

    /* Line Reader Overlay */
    .line-reader-bar {
      position: absolute;
      left: 0;
      right: 0;
      background-color: rgba(254, 240, 138, 0.4);
      border-top: 2px solid #ca8a04;
      border-bottom: 2px solid #ca8a04;
      pointer-events: none;
      transition: top 0.03s linear;
      z-index: 10;
    }

    /* Print Styles */
    @media print {
      .no-print { display: none !important; }
      body { background-color: #ffffff; color: #000000; font-size: 11pt; }
      .container { max-width: 100%; padding: 0; }
      .card { border: none; padding: 0; box-shadow: none; margin-bottom: 1rem; }
      .passage-title { font-size: 18pt; }
      .passage-body { font-size: 11pt; line-height: 1.6; margin-bottom: 1.5rem; }
      .question-card { background-color: #ffffff; border: none; padding: 0; margin-bottom: 1.25rem; }
      .option-item { border: none; padding: 0.2rem
